{{- /* Only when no existing Secret is named: then the URI comes from values */}}
{{- if not .Values.mongodb.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open5gs-em.fullname" . }}
  labels:
    {{- include "open5gs-em.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ include "open5gs-em.mongodbUri" . | quote }}
{{- end }}
